[project]
name = "intelligent-conversation-agent"
version = "0.1.0"
description = "Deterministic conversational message engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv",
    "httpx>=0.27,<1.0"
]

[tool.vercel]
entrypoint = "app.api:app"